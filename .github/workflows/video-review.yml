name: Review newly uploaded portfolio videos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/video-review.yml"
      - "assets/genz ad.mp4"
      - "assets/my laviva ad 2.mp4"
      - "assets/pakwan catering ad.mp4"
      - "assets/train ad.mp4"

permissions:
  contents: write

jobs:
  make-contact-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --quiet pillow
      - name: Extract selected video frames and metadata
        run: |
          mkdir -p review assets/posters
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          specs = [
              ("genz ad.mp4", "genz-style-in-every-thread.jpg", 22.2),
              ("my laviva ad 2.mp4", "laviva-the-wrong-target.jpg", 7.3),
              ("pakwan catering ad.mp4", "al-roohi-al-raza-catering.jpg", 29.2),
              ("train ad.mp4", "tokyo-platform-style-in-motion.jpg", 6.5),
          ]
          report, tiles = [], []
          for name, poster_name, ts in specs:
              path = Path("assets") / name
              if not path.exists():
                  report.append({"file": name, "error": "file not found"})
                  continue
              probe = subprocess.check_output([
                  "ffprobe", "-v", "error", "-show_entries",
                  "format=duration:stream=codec_name,width,height,r_frame_rate",
                  "-of", "json", str(path)
              ], text=True)
              info = json.loads(probe)
              duration = float(info.get("format", {}).get("duration", 0) or 0)
              ts = max(0, min(duration - 0.08, ts))
              poster_path = Path("assets/posters") / poster_name
              subprocess.run([
                  "ffmpeg", "-loglevel", "error", "-ss", str(ts), "-i", str(path),
                  "-frames:v", "1", "-vf",
                  "scale=960:540:force_original_aspect_ratio=increase,crop=960:540,setsar=1",
                  "-q:v", "2", "-y", str(poster_path)
              ], check=True)
              poster = Image.open(poster_path).convert("RGB")
              tiles.append((poster, f"{name} — selected frame at {ts:.1f}s"))
              report.append({"file": name, "bytes": path.stat().st_size,
                             "duration_seconds": round(duration, 2),
                             "streams": info.get("streams", []),
                             "poster": str(poster_path), "poster_time_seconds": ts})
          cols, tile_w, tile_h, label_h = 2, 960, 540, 42
          rows = (len(tiles)+cols-1)//cols
          sheet = Image.new("RGB", (cols*tile_w, rows*(tile_h+label_h)), "#101014")
          draw = ImageDraw.Draw(sheet)
          font = ImageFont.load_default()
          for i, (im, label) in enumerate(tiles):
              x, y = (i%cols)*tile_w, (i//cols)*(tile_h+label_h)
              sheet.paste(im, (x,y))
              draw.text((x+10,y+tile_h+10), label, fill="white", font=font)
          sheet.save("review/selected-posters-contact-sheet.jpg", quality=92)
          Path("review/metadata.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - name: Save the selected poster images to the portfolio repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/posters
          if ! git diff --cached --quiet; then
            git commit -m "Add selected video poster thumbnails"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: selected-portfolio-video-posters
          path: review/
          retention-days: 2
